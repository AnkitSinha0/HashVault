root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main.exe ./cmd/api"
  bin = "tmp\\main.exe"
  full_bin = "tmp\\main.exe"
  include_ext = ["go", "yaml", "yml"]
  exclude_dir = ["tmp", "bin", "vendor", "graphify-out"]
  delay = 1000

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
